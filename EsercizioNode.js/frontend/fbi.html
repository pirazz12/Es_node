<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>FBI Wanted</title>

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/weather.css">
    <link rel="stylesheet" href="css/fbi.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>
    <script>
        fetch("components/navbar.html")
            .then(res => res.text())
            .then(html => document.getElementById("navbar").innerHTML = html);
    </script>

    <!-- WEATHER CONTENT -->
    <main class="weather-wrapper fbi-wrapper">
        <section class="weather-box fbi-box">
            <h1>Scheda FBI del giorno</h1>
            <p class="subtitle">Una persona ricercata o una segnalazione dall'elenco pubblico FBI.</p>
            <div id="fbi-result" aria-live="polite">Caricamento...</div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>
    <script>
        fetch("components/footer.html")
            .then(res => res.text())
            .then(html => document.getElementById("footer").innerHTML = html);
    </script>
    <script src="js/fbi.js"></script>
</body>

</html>
